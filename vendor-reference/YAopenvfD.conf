# Please set the following configurations up according to one of the following source:
# - Arthur Libreman's official OpenVFD configurations, a lot of configs available, but some older ones might have wrong gpio
#   https://github.com/arthur-liberman/vfd-configurations
# - Ophub's Armbian repo, only a few configs, but some of them might have different yet correct gpio, some LED dots info are also correct
#   https://github.com/ophub/amlogic-s9xxx-armbian/tree/main/build-armbian/armbian-files/platform-files/amlogic/rootfs/usr/share/openvfd/conf

led_root=/sys/class/leds/openvfd

function get_lan_ip() 
{
  intf=$(ip route show | grep -v default | grep dev | awk '{print $3}' | grep -E '^(end|eth)' | head -1 )
  [ -z "$intf" ] && intf=end1
  IP=$(ip route show dev $intf 2>/dev/null | grep -v default | awk '{print $7}' | tr '.' '_')
  [ -z "$(echo $IP | grep _)" ] && IP=$(ifconfig $intf 2>/dev/null | grep "inet addr" | awk '{print $2}' | awk -F: '{print $2}' | tr '.' '_')
  [ -z "$IP" ] && IP=NULL
  echo "$IP"
}

function get_lan_gw() 
{
  intf=$(ip route show | grep -v default | grep dev | awk '{print $3}' | grep -E '^(end|eth)' | head -1 )
  [ -z "$intf" ] && intf=end1
  GW=$(ip route show dev $intf 2>/dev/null | grep default | awk '{print $3}' | tr '.' '_')
  [ -z "$GW" ] && GW=NULL
  echo "$GW"
}

function get_wifi_ip() 
{
  intf=$(ip route show | grep -v default | grep dev | awk '{print $3}' | grep -E '^(wlan)' | head -1 )
  [ -z "$intf" ] && intf=wlan0
  IP=$(ip route show dev $intf 2>/dev/null | grep -v default | awk '{print $7}' | tr '.' '_')
  [ -z "$(echo $IP | grep _)" ] && IP=$(ifconfig $intf 2>/dev/null | grep "inet addr" | awk '{print $2}' | awk -F: '{print $2}' | tr '.' '_')
  [ -z "$IP" ] && IP=NULL
  echo "$IP"
}

function get_wifi_gw() 
{
  intf=$(ip route show | grep -v default | grep dev | awk '{print $3}' | grep -E '^(wlan)' | head -1 )
  [ -z "$intf" ] && intf=wlan0
  GW=$(ip route show dev $intf 2>/dev/null | grep default | awk '{print $3}' | tr '.' '_')
  [ -z "$GW" ] && GW=NULL
  echo "$GW"
}

function get_yaopenvfd_info_old()
{
  [ "$vfd_lan_ip" == "NULL" -a "$vfd_wifi_ip" == "NULL" ] && {
    echo "20:date:24h 5:cpu 5:temp:0 20:date:24h 5:date:year 5:date:month_day"
    echo "eth" > $led_root/led_off
    echo "wifi" > $led_root/led_off
  }
  [ "$vfd_lan_ip" != "NULL" -a "$vfd_wifi_ip" == "NULL" ] && {
    echo "20:date:24h 5:cpu 5:temp:0 10:date:24h 20:string:'IP:${vfd_lan_ip}::' 20:date:24h 5:date:year 5:date:month_day 10:date:24h 20:string:'GAtE:${vfd_lan_gw}::'"
    echo "eth" > $led_root/led_on
    echo "wifi" > $led_root/led_off
  }
  [ "$vfd_lan_ip" == "NULL" -a "$vfd_wifi_ip" != "NULL" ] && {
    echo "20:date:24h 5:cpu 5:temp:0 10:date:24h 20:string:'IP:${vfd_wifi_ip}::' 20:date:24h 5:date:year 5:date:month_day 10:date:24h 20:string:'GAtE:${vfd_wifi_gw}::'"
    echo "eth" > $led_root/led_off
    echo "wifi" > $led_root/led_on
  }
  [ "$vfd_lan_ip" != "NULL" -a "$vfd_wifi_ip" != "NULL" ] && {
    echo "20:date:24h 5:cpu 5:temp:0 10:date:24h 20:string:'IP1:${vfd_lan_ip}::' 20:date:24h 5:date:year 5:date:month_day 10:date:24h 20:string:'GAtE1:${vfd_lan_gw}::' 20:date:24h 5:cpu 5:temp:0 10:date:24h 20:string:'IP2:${vfd_wifi_ip}::' 20:date:24h 5:date:year 5:date:month_day 10:date:24h 20:string:'GAtE2:${vfd_wifi_gw}::'"
    echo "eth" > $led_root/led_on
    echo "wifi" > $led_root/led_on
  }
}

function get_yaopenvfd_info()
{
  wgext config-vfd export
  echo "eth" > $led_root/led_on
  echo "wifi" > $led_root/led_off  
}

